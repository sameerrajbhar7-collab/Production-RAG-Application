
name: Production RAG CI/CD Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Check Python Syntax
        run: |
          python -m compileall -q .

      - name: Lint with Flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

  build-docker:
    name: Build and Push Docker Image
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || secrets.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.password }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || secrets.username }}/production-rag-application:latest
            ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || secrets.username }}/production-rag-application:${{ github.sha }}

  deploy-ec2:
    name: Deploy to AWS EC2
    needs: build-docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: OPENAI_API_KEY
          script: |
            set -e

            echo "=========================================="
            echo "Starting Production RAG deployment..."
            echo "=========================================="

            # Use user home directory to prevent "mkdir: Permission denied" on /opt
            APP_DIR="$HOME/production-rag"

            mkdir -p "$APP_DIR/chroma_db"
            mkdir -p "$APP_DIR/uploads"

            # Check if docker commands require sudo
            if docker ps >/dev/null 2>&1; then
              DOCKER_CMD="docker"
            else
              DOCKER_CMD="sudo docker"
            fi

            IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || secrets.username }}/production-rag-application:latest"

            echo "=== Disk Space Before Cleanup ==="
            df -h /

            echo "Stopping old container..."
            $DOCKER_CMD stop production-rag || true
            $DOCKER_CMD rm production-rag || true

            echo "Freeing disk space: removing unused Docker images and build cache..."
            $DOCKER_CMD system prune -af --volumes || true
            $DOCKER_CMD builder prune -af || true

            echo "Cleaning journal logs and temporary ingest files..."
            sudo journalctl --vacuum-size=50M || true
            sudo journalctl --vacuum-time=1d || true
            sudo apt-get clean || true
            sudo rm -rf /tmp/* /var/tmp/* || true
            sudo rm -rf /var/lib/containerd/io.containerd.content.v1.content/ingest/* || true

            echo "=== Disk Space After Cleanup ==="
            df -h /

            echo "Pulling latest Docker image: $IMAGE_NAME..."
            $DOCKER_CMD pull "$IMAGE_NAME"

            echo "Starting new container..."
            $DOCKER_CMD run -d \
              --name production-rag \
              --restart unless-stopped \
              -p 5000:5000 \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -v "$APP_DIR/chroma_db:/app/chroma_db" \
              -v "$APP_DIR/uploads:/app/uploads" \
              "$IMAGE_NAME"

            echo "Waiting for application startup..."
            for i in 1 2 3 4 5; do
              sleep 4
              if curl -fsS http://localhost:5000/health > /dev/null 2>&1 || curl -fsS http://localhost:5000/ > /dev/null 2>&1; then
                echo "Health check succeeded on attempt $i!"
                break
              fi
              echo "Attempt $i waiting for service..."
              if [ $i -eq 5 ]; then
                echo "Deployment health check failed! Fetching logs..."
                $DOCKER_CMD logs --tail 50 production-rag
                exit 1
              fi
            done

            echo "Deployment completed successfully!"
            $DOCKER_CMD ps
