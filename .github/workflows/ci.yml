
name: Production RAG CI/CD Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Check Python Syntax
        run: |
          python -m compileall -q .

      - name: Lint with Flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

  build-docker:
    name: Build and Push Docker Image
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/production-rag-application:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/production-rag-application:${{ github.sha }}

  deploy-ec2:
    name: Deploy to AWS EC2
    needs: build-docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2

        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: OPENAI_API_KEY

          script: |
            set -e

            echo "Starting Production RAG deployment..."

            APP_DIR="/opt/production-rag"

            mkdir -p "$APP_DIR/chroma_db"
            mkdir -p "$APP_DIR/uploads"

            echo "Pulling latest Docker image..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/production-rag-application:latest

            echo "Stopping old container..."

            docker stop production-rag || true
            docker rm production-rag || true

            echo "Starting new container..."

            docker run -d \
              --name production-rag \
              --restart unless-stopped \
              -p 5000:5000 \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -v "$APP_DIR/chroma_db:/app/chroma_db" \
              -v "$APP_DIR/uploads:/app/uploads" \
              ${{ secrets.DOCKERHUB_USERNAME }}/production-rag-application:latest

            echo "Checking application..."

            sleep 10

            if ! curl -fsS http://localhost:5000/ > /dev/null; then
              echo "Deployment health check failed!"
              docker logs production-rag
              exit 1
            fi

            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo "Deployment completed successfully!"

            docker ps
